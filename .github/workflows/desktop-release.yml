name: Desktop Release

on:
  push:
    tags:
      - 'desktop-v*'   # e.g. desktop-v0.1.0

permissions:
  contents: write   # needed to upload release assets

jobs:
  verify-tag:
    name: Verify desktop version tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match tag to desktop package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          test "$GITHUB_REF_NAME" = "desktop-v$PACKAGE_VERSION"

  build-mac:
    name: Build macOS
    needs: verify-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      # Python 3.12 removed `distutils` from stdlib but node-gyp (used by
      # native deps like better-sqlite3) still imports it. Pin to 3.11 so
      # the native build for the Electron app succeeds on macOS/Windows.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The desktop release only needs package files and binaries; electron-builder
      # downloads Electron during the build. Skip dependency postinstall scripts
      # so unrelated third-party network fetches cannot break installer releases
      # (for example free-email-domains fetching remote blocklists and hitting 429).
      - name: Install desktop dependencies
        timeout-minutes: 10
        working-directory: apps/desktop
        run: bun install --frozen-lockfile --ignore-scripts

      # Stage signing + notarization credentials only when the corresponding
      # secrets are present. Writing empty CSC_LINK into the build step's env
      # confuses electron-builder (it resolves "" to cwd and reports
      # "<cwd> not a file"), so we route everything through $GITHUB_ENV which
      # silently drops blank values.
      - name: Stage Apple signing + notary credentials
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12_BASE64" ]; then
            echo "::error::A Developer ID Application certificate is required for desktop releases" >&2
            exit 1
          fi
          if ! { [ -n "$APPLE_API_KEY_P8_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; } &&
             ! { [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; }; then
            echo "::error::Apple notarization credentials are required for desktop releases" >&2
            exit 1
          fi
          # GitHub runs this with `bash -e`, so guard short-circuits with
          # explicit if-blocks (`[ -n "$X" ] && echo …` would abort the step
          # whenever the var is empty).
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            CERT_PATH="$RUNNER_TEMP/weblab-cert.p12"
            printf '%s' "$MAC_CERT_P12_BASE64" | base64 -D > "$CERT_PATH"
            echo "CSC_LINK=$CERT_PATH" >> "$GITHUB_ENV"
            if [ -n "$MAC_CERT_PASSWORD" ]; then
              echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD" >> "$GITHUB_ENV"
            fi
            echo "Mac signing cert staged."
          else
            echo "MAC_CERT_P12_BASE64 not set — build will be unsigned."
          fi

          if [ -n "$APPLE_API_KEY_P8_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            if ! [[ "$APPLE_API_KEY_ID" =~ ^[A-Za-z0-9]+$ ]]; then
              echo "::error::APPLE_API_KEY_ID must be alphanumeric" >&2
              exit 1
            fi
            mkdir -p "$HOME/.appstoreconnect/private_keys"
            KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$KEY_PATH"
            echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            if [ -n "$APPLE_API_ISSUER" ]; then
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
            fi
            echo "Notary API key staged."
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            echo "Notary app-specific password staged."
          else
            echo "No notary credentials — notarize hook will skip."
          fi

          if [ -n "$APPLE_TEAM_ID" ]; then
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi

      - name: Build macOS DMG (x64 + arm64)
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run build:mac

      - name: Verify packaged macOS Bun
        working-directory: apps/desktop
        run: |
          codesign --verify --deep --strict "dist/mac-universal/Weblab.app"
          codesign -dv --verbose=4 "dist/mac-universal/Weblab.app" 2>&1 | grep -q 'Authority=Developer ID Application'
          BUN_PATH="dist/mac-universal/Weblab.app/Contents/Resources/bin/bun"
          test -x "$BUN_PATH"
          test "$("$BUN_PATH" --version)" = "1.3.10"
          xcrun lipo -verify_arch arm64 x86_64 "$BUN_PATH"

      - name: Save DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: |
            apps/desktop/dist/Weblab.dmg
            apps/desktop/dist/Weblab.zip
            apps/desktop/dist/Weblab.dmg.blockmap
            apps/desktop/dist/Weblab.zip.blockmap
            apps/desktop/dist/latest-mac.yml
          if-no-files-found: error

  build-win:
    name: Build Windows
    needs: verify-tag
    # Pinned to 2022 because windows-latest now ships VS 2026 (version 18)
    # which node-gyp doesn't recognize ("unknown version 'undefined' found at
    # C:\Program Files\Microsoft Visual Studio\18\Enterprise").
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      # Python 3.12 removed `distutils` from stdlib but node-gyp (used by
      # native deps like better-sqlite3) still imports it. Pin to 3.11 so
      # the native build for the Electron app succeeds on macOS/Windows.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The desktop release only needs package files and binaries; electron-builder
      # downloads Electron during the build. Skip dependency postinstall scripts
      # so unrelated third-party network fetches cannot break installer releases
      # (for example free-email-domains fetching remote blocklists and hitting 429).
      - name: Install desktop dependencies
        timeout-minutes: 10
        working-directory: apps/desktop
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build Windows installer
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run build:win

      - name: Verify packaged Windows Bun
        working-directory: apps/desktop
        run: |
          $bunPath = 'dist/win-unpacked/resources/bin/bun.exe'
          if (!(Test-Path $bunPath)) { throw "Missing packaged Bun: $bunPath" }
          if ((& $bunPath --version) -ne '1.3.10') { throw 'Packaged Bun version mismatch' }

      - name: Save EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-win
          path: |
            apps/desktop/dist/Weblab-Setup.exe
            apps/desktop/dist/Weblab-Setup.exe.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error

  build-linux:
    name: Build Linux
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      # Python 3.12 removed `distutils` from stdlib but node-gyp (used by
      # native deps like better-sqlite3) still imports it. Pin to 3.11 so
      # the native build for the Electron app succeeds on macOS/Windows.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The desktop release only needs package files and binaries; electron-builder
      # downloads Electron during the build. Skip dependency postinstall scripts
      # so unrelated third-party network fetches cannot break installer releases
      # (for example free-email-domains fetching remote blocklists and hitting 429).
      - name: Install desktop dependencies
        timeout-minutes: 10
        working-directory: apps/desktop
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build Linux AppImage
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run build:linux

      - name: Verify packaged Linux Bun
        working-directory: apps/desktop
        run: |
          BUN_PATH="dist/linux-unpacked/resources/bin/bun"
          test -x "$BUN_PATH"
          test "$("$BUN_PATH" --version)" = "1.3.10"

      - name: Save AppImage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            apps/desktop/dist/Weblab.AppImage
            apps/desktop/dist/latest-linux.yml
          if-no-files-found: error

  publish:
    name: Publish verified desktop release
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download verified installers
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete release set
        run: |
          test -s release-assets/Weblab.dmg
          test -s release-assets/Weblab.zip
          test -s release-assets/Weblab.dmg.blockmap
          test -s release-assets/Weblab.zip.blockmap
          test -s release-assets/latest-mac.yml
          test -s release-assets/Weblab-Setup.exe
          test -s release-assets/Weblab-Setup.exe.blockmap
          test -s release-assets/latest.yml
          test -s release-assets/Weblab.AppImage
          test -s release-assets/latest-linux.yml

      - name: Upload verified desktop release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Weblab.dmg
            release-assets/Weblab.zip
            release-assets/Weblab.dmg.blockmap
            release-assets/Weblab.zip.blockmap
            release-assets/latest-mac.yml
            release-assets/Weblab-Setup.exe
            release-assets/Weblab-Setup.exe.blockmap
            release-assets/latest.yml
            release-assets/Weblab.AppImage
            release-assets/latest-linux.yml
          overwrite_files: true
          # weblab.build's Mac download follows releases/latest, which must stay
          # on the desktop-local line. Team editor builds are never "latest".
          make_latest: false
          token: ${{ secrets.GITHUB_TOKEN }}

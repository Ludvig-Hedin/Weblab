name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # TODO: Enable lint job after applying lint fixes and setting appropriate warning limits
  # Will be handled in follow-up PR to avoid blocking CI setup / bloating this PR
  # lint:
  #   name: Lint
  #   runs-on: ubuntu-latest

  #   steps:
  #     - uses: actions/checkout@v4

  #     - uses: oven-sh/setup-bun@v2
  #       with:
  #         bun-version: 1.3.10
  #     - name: Cache dependencies
  #       uses: actions/cache@v4
  #       with:
  #         path: |
  #           ~/.bun/install/cache
  #         key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}

  #     - name: Install dependencies
  #       run: bun install --frozen

  #     - name: Run linter
  #       run: bun lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}

      - name: Install dependencies
        run: bun install --frozen

      - name: Run type checking
        run: bun typecheck

  test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}

      - name: Install dependencies
        run: bun install --frozen

      - name: Run tests
        run: |
          git ls-files '*test.*' ':!apps/desktop-local/**' ':!examples/sanity-pilot/**' | xargs bun test --timeout 30000 --coverage > /tmp/bun-test.log 2>&1 || {
            cat /tmp/bun-test.log
            exit 1
          }
          tail -n 80 /tmp/bun-test.log

  sanity-pilot:
    name: Sanity pilot
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      # The example deliberately has its own dependency graph outside the
      # monorepo workspaces. Match the standalone setup used for the pilot.
      - name: Prepare isolated site
        run: cp -R examples/sanity-pilot "$RUNNER_TEMP/sanity-pilot"

      - name: Install site dependencies
        working-directory: ${{ runner.temp }}/sanity-pilot
        run: bun install --ignore-scripts

      - name: Check site
        working-directory: ${{ runner.temp }}/sanity-pilot
        run: |
          bun test test/content.test.ts test/pages.test.tsx test/studio.test.tsx
          bun run lint
          bun run typecheck
          bun run build

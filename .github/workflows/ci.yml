name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # TODO: Enable lint job after applying lint fixes and setting appropriate warning limits
  # Will be handled in follow-up PR to avoid blocking CI setup / bloating this PR
  # lint:
  #   name: Lint
  #   runs-on: ubuntu-latest

  #   steps:
  #     - uses: actions/checkout@v4

  #     - uses: oven-sh/setup-bun@v2
  #       with:
  #         bun-version: 1.3.10
  #     - name: Cache dependencies
  #       uses: actions/cache@v4
  #       with:
  #         path: |
  #           ~/.bun/install/cache
  #         key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}

  #     - name: Install dependencies
  #       run: bun install --frozen

  #     - name: Run linter
  #       run: bun lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}

      - name: Install dependencies
        run: bun install --frozen

      - name: Run type checking
        run: bun typecheck

  test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}

      - name: Install dependencies
        run: bun install --frozen

      - name: Run tests
        run: |
          git ls-files '*test.*' ':!apps/desktop-local/**' ':!apps/desktop/**' ':!examples/sanity-pilot/**' | xargs bun test --timeout 30000 --coverage > /tmp/bun-test.log 2>&1 || {
            cat /tmp/bun-test.log
            exit 1
          }
          tail -n 80 /tmp/bun-test.log

  # The team desktop shell is Mac-only: its tests call macOS git/ps paths and
  # fail on Linux runners, so they run here instead of in the Unit Test job.
  desktop-test:
    name: Desktop Test (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Run desktop tests
        # The process-identity tests race real process start and exit, and a
        # loaded runner can lose that race. One retry separates that from a
        # real failure.
        run: |
          run_tests() { git ls-files 'apps/desktop/**/*test.*' 'apps/desktop/*test.*' | xargs bun test --timeout 30000; }
          run_tests || { echo "::warning::Desktop tests failed once, retrying"; run_tests; }
